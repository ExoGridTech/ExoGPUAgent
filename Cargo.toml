[package]
name = "exogpuagent"
version = "0.3.0"
edition = "2021"
description = "Lightweight, local-first NVIDIA GPU telemetry agent"
license = "MIT"
repository = "https://github.com/ExoGridTech/ExoGPUAgent"
readme = "README.md"
keywords = ["nvidia", "nvml", "gpu", "telemetry"]
categories = ["hardware-support", "command-line-utilities"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
toml = "0.8"
tower = "0.5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
