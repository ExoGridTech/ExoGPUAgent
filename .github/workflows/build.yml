# Manual CI build for Windows/Linux release binaries (no GitHub Release).
# NVML is loaded at runtime via libloading — runners do not need NVIDIA GPUs/drivers.
# Linux DEB builds on ubuntu-22.04 for glibc 2.35 baseline (Ubuntu 22.04 / Debian 12 target).

name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64

      - name: Read crate version
        id: meta
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          ARTIFACT="exogpuagent-v${VERSION}-windows-x64-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Packaging as ${ARTIFACT}"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

      - name: Stage portable artifact (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = "${{ steps.meta.outputs.artifact }}"
          $staging = "dist/$artifact"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $versioned = "exogpuagent-v${{ steps.meta.outputs.version }}-windows-x64.exe"
          $src = "target/release/exogpuagent.exe"
          if (-not (Test-Path $src)) { throw "Missing release binary: $src" }

          Copy-Item $src (Join-Path $staging $versioned)
          Copy-Item $src (Join-Path $staging "exogpuagent.exe")
          Copy-Item "README.md" (Join-Path $staging "README.md")
          Copy-Item "docs\phase-2b-windows.md" (Join-Path $staging "phase-2b-windows.md")
          if (Test-Path "docs\phase-2c-linux.md") {
            Copy-Item "docs\phase-2c-linux.md" (Join-Path $staging "phase-2c-linux.md")
          }

          $sums = @()
          $files = @($versioned, "exogpuagent.exe", "README.md", "phase-2b-windows.md")
          if (Test-Path (Join-Path $staging "phase-2c-linux.md")) {
            $files += "phase-2c-linux.md"
          }
          foreach ($f in $files) {
            $path = Join-Path $staging $f
            if (-not (Test-Path $path)) { throw "Missing staged file: $path" }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLower()
            $sums += "$hash  $f"
          }
          $sumPath = Join-Path $staging "SHA256SUMS.txt"
          ($sums -join "`n") + "`n" | Set-Content -NoNewline -Encoding ascii $sumPath

          foreach ($line in Get-Content $sumPath) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split "\s+", 2
            $expected = $parts[0].ToLower()
            $name = $parts[1].Trim()
            $actual = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $staging $name)).Hash.ToLower()
            if ($expected -ne $actual) {
              throw "Checksum mismatch for $name"
            }
          }

          Get-ChildItem $staging | Format-Table Name, Length
          Get-Content $sumPath

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isccDefault = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $isccAlt = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          if ((Test-Path $isccDefault) -or (Test-Path $isccAlt)) {
            Write-Host "Inno Setup already present"
            exit 0
          }
          choco install innosetup -y --no-progress
          if (-not ((Test-Path $isccDefault) -or (Test-Path $isccAlt))) {
            throw "Inno Setup 6 ISCC.exe not found after choco install"
          }

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          Write-Host "Using ISCC: $iscc"

          $src = (Resolve-Path "target\release\exogpuagent.exe").Path
          New-Item -ItemType Directory -Force -Path "dist\windows-installer" | Out-Null
          & $iscc "/DSourceExe=$src" "packaging\windows\exogpuagent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

          $setup = "dist\windows-installer\ExoGPUAgent-Setup-v${{ steps.meta.outputs.version }}-win64.exe"
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }

          $outDir = "dist\ExoGPUAgent-Setup-v${{ steps.meta.outputs.version }}-win64-${{ steps.meta.outputs.short_sha }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $setupName = "ExoGPUAgent-Setup-v${{ steps.meta.outputs.version }}-win64.exe"
          Copy-Item $setup (Join-Path $outDir $setupName)
          Copy-Item "README.md" (Join-Path $outDir "README.md")
          Copy-Item "docs\phase-2b-windows.md" (Join-Path $outDir "phase-2b-windows.md")

          $sums = @()
          foreach ($f in @($setupName, "README.md", "phase-2b-windows.md")) {
            $path = Join-Path $outDir $f
            $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLower()
            $sums += "$hash  $f"
          }
          $sumPath = Join-Path $outDir "SHA256SUMS.txt"
          ($sums -join "`n") + "`n" | Set-Content -NoNewline -Encoding ascii $sumPath
          Get-Content $sumPath

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/${{ steps.meta.outputs.artifact }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExoGPUAgent-Setup-v${{ steps.meta.outputs.version }}-win64-${{ steps.meta.outputs.short_sha }}
          path: dist/ExoGPUAgent-Setup-v${{ steps.meta.outputs.version }}-win64-${{ steps.meta.outputs.short_sha }}/
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux x64 (ubuntu-22.04 / glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64-jammy

      - name: Read crate version
        id: meta
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          ARTIFACT="exogpuagent-v${VERSION}-linux-x64-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Packaging as ${ARTIFACT}"
          ldd --version > /tmp/ega-ldd-version.txt 2>&1 || true
          head -n 1 /tmp/ega-ldd-version.txt || true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

      - name: Record glibc requirements
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/exogpuagent
          echo "=== ldd ==="
          ldd "$BIN"
          echo "=== GLIBC symbols ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -u
          mkdir -p dist/meta
          {
            echo "runner=ubuntu-22.04"
            ldd --version > /tmp/ega-ldd-version.txt 2>&1 || true
            head -n 1 /tmp/ega-ldd-version.txt || true
            echo "symbols:"
            objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -u
          } > dist/meta/glibc-baseline.txt
          cat dist/meta/glibc-baseline.txt

      - name: Stage portable artifact (Linux .tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.meta.outputs.artifact }}"
          VERSION="${{ steps.meta.outputs.version }}"
          OS="linux-x64"
          OUT="dist/${ARTIFACT}"
          PKG="dist/pkg"
          VERSIONED="exogpuagent-v${VERSION}-${OS}"
          TARBALL="${ARTIFACT}.tar.gz"

          rm -rf "${OUT}" "${PKG}"
          mkdir -p "${OUT}" "${PKG}/packaging" "${PKG}/scripts"

          install -m 0755 "target/release/exogpuagent" "${PKG}/exogpuagent"
          install -m 0755 "target/release/exogpuagent" "${PKG}/${VERSIONED}"
          cp README.md "${PKG}/README.md"
          cp docs/phase-2c-linux.md "${PKG}/phase-2c-linux.md"
          cp packaging/linux/exogpuagent.service "${PKG}/packaging/exogpuagent.service"
          cp packaging/linux/config.toml.default "${PKG}/packaging/config.toml.default"
          cp scripts/linux/Validate-LinuxInstall.sh "${PKG}/scripts/Validate-LinuxInstall.sh"
          chmod +x "${PKG}/scripts/Validate-LinuxInstall.sh"
          cp dist/meta/glibc-baseline.txt "${PKG}/glibc-baseline.txt"

          (
            cd "${PKG}"
            sha256sum exogpuagent "${VERSIONED}" README.md phase-2c-linux.md \
              packaging/exogpuagent.service packaging/config.toml.default \
              scripts/Validate-LinuxInstall.sh glibc-baseline.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            test -x exogpuagent
            test -x "${VERSIONED}"
          )

          tar -C "${PKG}" -czf "${OUT}/${TARBALL}" \
            exogpuagent "${VERSIONED}" README.md phase-2c-linux.md \
            packaging scripts glibc-baseline.txt SHA256SUMS.txt

          (
            cd "${OUT}"
            sha256sum "${TARBALL}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          test -f "${OUT}/${TARBALL}"
          test -s "${OUT}/SHA256SUMS.txt"
          ls -la "${OUT}"
          tar -tzvf "${OUT}/${TARBALL}"
          cat "${OUT}/SHA256SUMS.txt"

      - name: Build Debian package
        id: deb
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          DEB_NAME="exogpuagent_${VERSION}_amd64.deb"
          DEB_PATH="dist/deb/${DEB_NAME}"
          STAGE="dist/exogpuagent-deb-v${VERSION}-amd64-${SHORT_SHA}"
          META="dist/deb/build-meta.txt"

          chmod +x packaging/linux/build-deb.sh
          VERSION="${VERSION}" \
            BIN="${PWD}/target/release/exogpuagent" \
            OUT_DIR="${PWD}/dist/deb" \
            ./packaging/linux/build-deb.sh

          if [[ ! -f "${DEB_PATH}" ]]; then
            echo "::error::Debian package was not produced at ${DEB_PATH}"
            ls -la dist/deb || true
            exit 1
          fi
          if [[ ! -s "${DEB_PATH}" ]]; then
            echo "::error::Debian package at ${DEB_PATH} is empty"
            exit 1
          fi
          if [[ ! -f "${META}" ]]; then
            echo "::error::build-meta.txt missing after package build"
            exit 1
          fi
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            echo "::error::dpkg-deb missing after package build"
            exit 1
          fi
          dpkg-deb -I "${DEB_PATH}" >/tmp/ega-deb-info.txt
          cat /tmp/ega-deb-info.txt
          if ! grep -q "Package: exogpuagent" /tmp/ega-deb-info.txt; then
            echo "::error::dpkg-deb -I did not report Package: exogpuagent"
            exit 1
          fi
          # Integrity: list contents to a file first. Do NOT pipe dpkg-deb into
          # `grep -q` under pipefail — grep exits early and tar gets SIGPIPE
          # (false "missing binary" failure).
          if ! dpkg-deb -c "${DEB_PATH}" >/tmp/ega-deb-contents.txt; then
            echo "::error::dpkg-deb -c failed for ${DEB_PATH}"
            exit 1
          fi
          if ! grep -F './usr/bin/exogpuagent' /tmp/ega-deb-contents.txt >/dev/null; then
            echo "::error::.deb does not contain /usr/bin/exogpuagent"
            head -n 50 /tmp/ega-deb-contents.txt || true
            exit 1
          fi

          mkdir -p "${STAGE}"
          cp "${DEB_PATH}" "${STAGE}/${DEB_NAME}"
          cp "${META}" "${STAGE}/build-meta.txt"
          cp docs/phase-2c-linux.md "${STAGE}/"
          cp dist/meta/glibc-baseline.txt "${STAGE}/"
          (
            cd "${STAGE}"
            sha256sum "${DEB_NAME}" build-meta.txt phase-2c-linux.md glibc-baseline.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            test -f "${DEB_NAME}"
            test -s "${DEB_NAME}"
          )
          ls -la "${STAGE}"
          cat "${STAGE}/SHA256SUMS.txt"
          cat "${STAGE}/build-meta.txt"

          echo "deb_name=${DEB_NAME}" >> "$GITHUB_OUTPUT"
          echo "deb_stage=${STAGE}" >> "$GITHUB_OUTPUT"
          echo "deb_path=${DEB_PATH}" >> "$GITHUB_OUTPUT"

          {
            echo "## Linux artifacts (separate downloads)"
            echo
            echo "| Artifact | Contents |"
            echo "|----------|----------|"
            echo "| \`${{ steps.meta.outputs.artifact }}\` | Portable \`.tar.gz\` only |"
            echo "| \`exogpuagent-deb-v${VERSION}-amd64-${SHORT_SHA}\` | \`${DEB_NAME}\` + checksums + \`build-meta.txt\` |"
            echo
            echo "Download the **deb** artifact for \`apt install\`. The portable artifact does **not** include the \`.deb\`."
            echo
            echo '```'
            cat "${META}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke DEB lifecycle (disposable runner)
        shell: bash
        run: |
          set -euo pipefail
          DEB_PATH="${{ steps.deb.outputs.deb_path }}"
          if [[ -z "${DEB_PATH}" || ! -f "${DEB_PATH}" ]]; then
            echo "::error::Smoke test cannot run: .deb missing (${DEB_PATH:-unset})"
            exit 1
          fi
          chmod +x scripts/linux/smoke-deb-lifecycle.sh
          sudo ./scripts/linux/smoke-deb-lifecycle.sh "${DEB_PATH}"
          # Ensure packaging outputs still exist after smoke (smoke must not delete them)
          if [[ ! -f "${DEB_PATH}" ]]; then
            echo "::error::.deb disappeared after smoke test: ${DEB_PATH}"
            exit 1
          fi
          if [[ ! -f "${{ steps.deb.outputs.deb_stage }}/${{ steps.deb.outputs.deb_name }}" ]]; then
            echo "::error::staged .deb missing after smoke test"
            exit 1
          fi

      - name: Verify Debian artifact staged before upload
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${{ steps.deb.outputs.deb_stage }}"
          DEB_NAME="${{ steps.deb.outputs.deb_name }}"
          PORTABLE_OUT="dist/${{ steps.meta.outputs.artifact }}"
          echo "Checking dedicated DEB stage: ${STAGE}"
          if [[ ! -d "${STAGE}" ]]; then
            echo "::error::DEB stage directory missing: ${STAGE}"
            exit 1
          fi
          if [[ ! -f "${STAGE}/${DEB_NAME}" || ! -s "${STAGE}/${DEB_NAME}" ]]; then
            echo "::error::staged .deb missing or empty: ${STAGE}/${DEB_NAME}"
            exit 1
          fi
          if [[ ! -f "${STAGE}/SHA256SUMS.txt" ]]; then
            echo "::error::staged SHA256SUMS.txt missing"
            exit 1
          fi
          if [[ ! -f "${STAGE}/build-meta.txt" ]]; then
            echo "::error::staged build-meta.txt missing"
            exit 1
          fi
          (
            cd "${STAGE}"
            sha256sum -c SHA256SUMS.txt
          )
          # Portable must remain separate (no .deb duplication).
          if [[ -f "${PORTABLE_OUT}/${DEB_NAME}" ]]; then
            echo "::error::portable artifact must not contain ${DEB_NAME} (artifacts must stay separate)"
            exit 1
          fi
          if [[ ! -d "${PORTABLE_OUT}" ]]; then
            echo "::error::portable staging dir missing: ${PORTABLE_OUT}"
            exit 1
          fi
          ls -la "${STAGE}"
          ls -la "${PORTABLE_OUT}"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/${{ steps.meta.outputs.artifact }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          # Explicit "deb" in the name so it is not confused with the portable tarball.
          name: exogpuagent-deb-v${{ steps.meta.outputs.version }}-amd64-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.deb.outputs.deb_stage }}/
          if-no-files-found: error
          retention-days: 14
